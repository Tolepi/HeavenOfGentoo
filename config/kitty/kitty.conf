# -----------------------------------------------------------------------------
# TIPO DE LETRA (FONT CONFIGURATION)
# -----------------------------------------------------------------------------
font_family      Terminess Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13
adjust_line_height  110%

# Optimización de renderizado para Iosevka
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# -----------------------------------------------------------------------------
# PALETA DE COLORES (TOKYO NIGHT / GENTOO-DARK)
# -----------------------------------------------------------------------------
# Colores Principales
background            #101216
foreground            #c0caf5
selection_background  #161920
selection_foreground  #7dcfff
url_color             #7dcfff
cursor                #9d7cd8
cursor_text_color     #101216

# Colores de la Terminal (Normales / Brillantes)
# Black (Fondo / Muted)
color0  #161920
color8  #565f89

# Red (Tokyo Night Red / Alertas)
color1  #f7768e
color9  #f7768e

# Green (Prompt / Acento)
color2  #9ece6a
color10 #9ece6a

# Yellow 
color3  #e0af68
color11 #e0af68

# Blue (Gentoo Purple sutil / Azul profundo)
color4  #7aa2f7
color12 #7aa2f7

# Magenta (Gentoo Purple principal)
color5  #9d7cd8
color13 #9d7cd8

# Cyan (Acento secundario)
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5

# -----------------------------------------------------------------------------
# DISEÑO Y BORDES (WINDOW LAYOUT & PADDING)
# -----------------------------------------------------------------------------
window_padding_width 15
remember_window_size  no
initial_window_width  800
initial_window_height 500

# Bordes de pestañas (Tabs) en caso de que uses multi-tab
tab_bar_style               powerline
tab_powerline_style         slanted
active_tab_foreground       #101216
active_tab_background       #9d7cd8
inactive_tab_foreground     #565f89
inactive_tab_background     #161920
tab_bar_background          #101216

# -----------------------------------------------------------------------------
# COMPORTAMIENTO (MISC)
# -----------------------------------------------------------------------------
enable_audio_bell no
confirm_os_window_close 0
