[colors]
bg = #101216
card = #161920
fg = #c0caf5
muted = #565f89
purple = #9d7cd8
cyan = #7dcfff
green = #9ece6a
border = #1f2335

[bar/main]
width = 100%
height = 28pt
radius = 6

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 3pt

# Aquí aplicamos los bordes visibles alrededor de toda la barra
border-size = 2pt
border-color = ${colors.purple}

padding-left = 2
padding-right = 2

module-margin = 1

separator = " │ "
separator-foreground = ${colors.border}

font-0 = "Terminess Nerd Font:size=11;3"
font-1 = "Terminess Nerd Font:size=13;3"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = filesystem battery memory cpu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.card}
label-active-underline= ${colors.purple}
label-active-padding = 2

label-occupied = %name%
label-occupied-padding = 2
label-occupied-foreground = ${colors.cyan}

label-urgent = %name%
label-urgent-background = ${colors.green}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.muted}

[module/filesystem]
type = internal/filesystem
interval = 25
mount-0 = /
label-mounted = 󰋊 %percentage_used%%
label-mounted-foreground = ${colors.cyan}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.purple}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.purple}
label = %percentage%%

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S
date-alt = %Y-%m-%d %H:%M:%S
label = 󱑎 %date%
label-foreground = ${colors.purple}
label-background = ${colors.card}
label-padding = 2

[module/battery]
type = internal/battery

; Hardware configurations (Change to match your system names)
battery = BAT1
adapter = ACAD
poll-interval = 5

; Layout structures for each battery state
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

; Tokyo Night Purple styling for the icons
animation-charging-foreground = ${colors.purple}
ramp-capacity-foreground = ${colors.purple}

; Text configuration and colors
label-charging = %percentage%%
label-charging-foreground = ${colors.foreground}

label-discharging = %percentage%%
label-discharging-foreground = ${colors.foreground}

label-full = 100%
label-full-foreground = ${colors.foreground}

; Charging animations (FontAwesome icons)
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-frames = 5
animation-charging-framerate = 750

; Discharging and full states (FontAwesome icons)
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
